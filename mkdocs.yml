site_name: My Docs

theme:
  name: material
  # custom_dir: overriders
  # favicon: images/favicon.png
  # language: en
  # icon:
    # logo: fontawsome/solid/hat-cowboy
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - announce.dismiss
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest

  plugins:
    - search
    - mkdocstrings:
        handlers:
          python:
            options:
              docstring_style: numpy

  palette:

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
